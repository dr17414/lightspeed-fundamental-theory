name: Fix Stage 5B intervention evidence

on:
  push:
    branches: [ stage5b-limited-result-b ]
    paths: [ .github/workflows/fix-stage5b-intervention.yml ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5b-limited-result-b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install numpy scipy pytest mpmath
      - name: Patch Stage 5B intervention evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          expected = {
              'analysis/stage5b_link_channel.py': '201ed65079832e5c6544eb72661cf153821fc8ae',
              'tests/test_stage5b_link_channel.py': 'aa65d4ed26ac6e92f06606ae7c99ffd66306e588',
              'docs/STAGE5B_RESULT_B.md': 'a7496f5da03241b007c5edcaf8d7c767ae713e24',
              'docs/STATUS.md': 'ab0a68138f18af24ec953b0bb160d54e91a8fa42',
          }
          for f,h in expected.items():
              got=subprocess.check_output(['git','hash-object',f],text=True).strip()
              assert got == h, (f,got,h)

          # --- analysis ---
          p=Path('analysis/stage5b_link_channel.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              '  2. The rank diagnostic uses population in strips outside the empty link\n'
              '     Alexandrov interval.  A constructive remote-population intervention can\n'
              '     change chi while preserving all old-old order relations and preserving the\n'
              '     target pair as a link.  Hence this particular chi is not a microscopic\n'
              '     link-local rule.\n',
              '  2. The rank diagnostic uses population in strips outside the empty link\n'
              '     Alexandrov interval.  A constructive link-external intervention can change\n'
              '     chi while preserving all old-old order relations and preserving the target\n'
              '     pair as a link.  The benchmark separately requires an intrinsic order-depth\n'
              '     threshold, so "outside the interval" is not misreported as independent\n'
              '     remoteness evidence.  Hence this particular chi is not a microscopic\n'
              '     link-local rule.\n')
          s=s.replace('BOTTOM = "BOTTOM"\n', 'BOTTOM = "BOTTOM"\nREMOTE_MIN_OLD_INTERVAL = 5\n')

          s=re.sub(
              r'@dataclass\(frozen=True\)\nclass InterventionResult:.*?\n\n\ndef _is_link',
              '''@dataclass(frozen=True)\nclass InterventionResult:\n    old_channel: str\n    new_channel: str\n    added: int\n    old_dU: int\n    old_dV: int\n    new_dU: int\n    new_dV: int\n    old_relation_preserved: bool\n    link_preserved: bool\n    old_interval_to_y_counts: tuple[int, ...]\n\n\ndef _is_link''',
              s, flags=re.S)

          new_func = '''def flip_by_link_external_population(\n    u: np.ndarray, v: np.ndarray, x: int, y: int\n) -> tuple[np.ndarray, np.ndarray, InterventionResult]:\n    """Constructively flip rank_channel using population outside I(x,y).\n\n    If chi=U, add points with u<u_x but v_x<v<v_y. They increase Delta r_V\n    only. If chi=V, use the exchanged construction. No old coordinates move,\n    so every old-old order relation is exactly preserved. Because the target\n    pair remains a link, no added point lies in the open Alexandrov interval.\n\n    The returned ``old_interval_to_y_counts`` is the independent intrinsic\n    separation diagnostic: for every added point w it counts only *pre-existing*\n    events z with w<z<y. The source-of-record benchmark requires this count to\n    be at least REMOTE_MIN_OLD_INTERVAL for every added point; link preservation\n    itself is not treated as evidence of remoteness.\n    """\n    R0 = order_from_uv(u, v)\n    if not _is_link(R0, x, y):\n        raise ValueError("intervention target must be a causal link")\n    rU0, rV0 = rank_array(u), rank_array(v)\n    old = rank_channel(rU0, rV0, x, y)\n    if old == BOTTOM:\n        raise ValueError("cannot define a flip direction for a tie")\n    dU0 = int(rU0[y] - rU0[x])\n    dV0 = int(rV0[y] - rV0[x])\n    nadd = abs(dU0 - dV0) + 1\n\n    # Put the active coordinate near the x-side of its slab and the other\n    # coordinate on the low outer wing. This tends to create substantial\n    # causal depth to y, but the benchmark accepts a candidate only after the\n    # order-theoretic depth has been measured; coordinates are not the criterion.\n    frac = np.linspace(0.04, 0.12, nadd)\n    lowfrac = np.linspace(0.02, 0.08, nadd)\n    if old == "U":\n        # Increase only the V-rank gap.\n        unew = u[x] * lowfrac\n        vnew = v[x] + frac * (v[y] - v[x])\n    else:\n        # Increase only the U-rank gap.\n        unew = u[x] + frac * (u[y] - u[x])\n        vnew = v[x] * lowfrac\n\n    n0 = len(u)\n    ua = np.concatenate([u, unew])\n    va = np.concatenate([v, vnew])\n    Ra = order_from_uv(ua, va)\n    rUa, rVa = rank_array(ua), rank_array(va)\n    new = rank_channel(rUa, rVa, x, y)\n    dUa = int(rUa[y] - rUa[x])\n    dVa = int(rVa[y] - rVa[x])\n\n    # Intrinsic depth: count only old events in each I(w,y), so the intervention\n    # cannot make itself look remote by adding its own intermediate points.\n    old_depths = []\n    for k in range(n0, len(ua)):\n        old_depths.append(int(np.sum(Ra[k, :n0] & Ra[:n0, y])))\n\n    result = InterventionResult(\n        old_channel=old,\n        new_channel=new,\n        added=nadd,\n        old_dU=dU0,\n        old_dV=dV0,\n        new_dU=dUa,\n        new_dV=dVa,\n        old_relation_preserved=bool(np.array_equal(Ra[:n0, :n0], R0)),\n        link_preserved=_is_link(Ra, x, y),\n        old_interval_to_y_counts=tuple(old_depths),\n    )\n    return ua, va, result\n'''
          s=re.sub(
              r'def flip_by_remote_population\(.*?^    return ua, va, result\n',
              new_func, s, flags=re.S|re.M)

          old_sel = '''    # Select low-margin links so an O(1) remote intervention is visible.  This\n    # is a constructive witness, not an unbiased population estimate.\n    candidates = sorted(\n        [\n            (abs(int(rU[y] - rU[x]) - int(rV[y] - rV[x])), x, y)\n            for x, y in non_tie\n        ],\n        key=lambda t: (t[0], t[1], t[2]),\n    )\n    chosen = candidates[:interventions]\n    results = []\n    for _, x, y in chosen:\n        _, _, res = flip_by_remote_population(u, v, x, y)\n        results.append(res)\n'''
          new_sel = '''    # Constructive witness, not an unbiased population estimate. Sort by rank\n    # margin, but accept a link only if every added point is intrinsically\n    # order-separated from y by at least REMOTE_MIN_OLD_INTERVAL old events.\n    candidates = sorted(\n        [\n            (abs(int(rU[y] - rU[x]) - int(rV[y] - rV[x])), x, y)\n            for x, y in non_tie\n        ],\n        key=lambda t: (t[0], t[1], t[2]),\n    )\n    results = []\n    candidates_scanned = 0\n    for _, x, y in candidates:\n        candidates_scanned += 1\n        _, _, res = flip_by_link_external_population(u, v, x, y)\n        if min(res.old_interval_to_y_counts) < REMOTE_MIN_OLD_INTERVAL:\n            continue\n        results.append(res)\n        if len(results) == interventions:\n            break\n    if len(results) != interventions:\n        raise RuntimeError(\n            f"only {len(results)} links met intrinsic order-depth threshold "\n            f"{REMOTE_MIN_OLD_INTERVAL}"\n        )\n    all_depths = [d for r in results for d in r.old_interval_to_y_counts]\n'''
          assert old_sel in s
          s=s.replace(old_sel,new_sel)
          s=s.replace(
              '        "interventions": len(results),\n'
              '        "intervention_flips": sum(r.old_channel != r.new_channel for r in results),\n'
              '        "median_added": float(np.median([r.added for r in results])) if results else float("nan"),\n'
              '        "all_old_relations_preserved": all(r.old_relation_preserved for r in results),\n'
              '        "all_links_preserved": all(r.link_preserved for r in results),\n'
              '        "all_added_outside_interval": all(r.all_added_outside_interval for r in results),\n',
              '        "interventions": len(results),\n'
              '        "intervention_flips": sum(r.old_channel != r.new_channel for r in results),\n'
              '        "median_added": float(np.median([r.added for r in results])) if results else float("nan"),\n'
              '        "total_added": int(sum(r.added for r in results)),\n'
              '        "remote_min_old_interval_threshold": REMOTE_MIN_OLD_INTERVAL,\n'
              '        "remote_candidates_scanned": candidates_scanned,\n'
              '        "min_old_interval_to_y": int(min(all_depths)),\n'
              '        "median_old_interval_to_y": float(np.median(all_depths)),\n'
              '        "max_old_interval_to_y": int(max(all_depths)),\n'
              '        "all_old_relations_preserved": all(r.old_relation_preserved for r in results),\n'
              '        "all_links_preserved": all(r.link_preserved for r in results),\n')
          p.write_text(s,encoding='utf-8',newline='\n')

          # --- tests ---
          p=Path('tests/test_stage5b_link_channel.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace('    flip_by_remote_population,\n', '    REMOTE_MIN_OLD_INTERVAL,\n    flip_by_link_external_population,\n')
          t=t.replace('def test_remote_population_can_flip_rank_channel_without_breaking_link():',
                      'def test_link_external_population_can_flip_rank_channel_without_breaking_link():')
          t=t.replace('    _, _, res = flip_by_remote_population(u, v, x, y)\n',
                      '    _, _, res = flip_by_link_external_population(u, v, x, y)\n')
          t=t.replace('    assert res.all_added_outside_interval\n','')
          t=t.replace('    assert b["median_added"] == 3.0\n',
                      '    assert b["median_added"] == 5.5\n    assert b["total_added"] == 320\n')
          t=t.replace('    assert b["all_added_outside_interval"]\n','')
          t=t.replace('    assert b["conformal_metric_comparable"] == 1328\n',
                      '    assert b["conformal_metric_comparable"] == 1328\n'
                      '    assert b["remote_min_old_interval_threshold"] == REMOTE_MIN_OLD_INTERVAL == 5\n'
                      '    assert b["remote_candidates_scanned"] == 186\n'
                      '    assert b["min_old_interval_to_y"] == 5\n'
                      '    assert b["median_old_interval_to_y"] == 8.0\n'
                      '    assert b["max_old_interval_to_y"] == 21\n')
          p.write_text(t,encoding='utf-8',newline='\n')

          # --- formal note ---
          p=Path('docs/STAGE5B_RESULT_B.md')
          d=p.read_text(encoding='utf-8')
          old='''The source-of-record intervention makes this dependence constructive. For a link classified `U`, add elements with\n\n\\[\nu_w<u_x,\\qquad v_x<v_w<v_y.\n\\]\n\nThese new elements lie outside `I(x,y)`. They leave all pre-existing order relations unchanged, preserve `x<.y` as a link, leave `Delta r_U` unchanged, and increase only `Delta r_V`. The `V` case is obtained by exchanging `U` and `V`.\n\nIn the fixed benchmark, 60/60 selected low-margin links flip channel; the median number of added elements is 3. This is a constructive witness that this rank-based `chi` is **not** a microscopic link-local rule.\n'''
          new='''The source-of-record intervention makes this dependence constructive. For a link classified `U`, add elements with\n\n\\[\nu_w<u_x,\\qquad v_x<v_w<v_y.\n\\]\n\nThey leave all pre-existing order relations unchanged, preserve `x<.y` as a link, leave `Delta r_U` unchanged, and increase only `Delta r_V`. The `V` case is obtained by exchanging `U` and `V`. Merely saying that the new points are outside `I(x,y)` is **not** an independent remoteness test: if an added point entered the open interval, the target pair would cease to be a link. The benchmark therefore measures a separate, purely order-theoretic quantity for every added point `w`,\n\n\\[\n|I(w,y)\\cap C_{\\rm old}|,\n\\]\n\ncounting only pre-existing events between `w` and `y`. The 60 intervention targets are selected only when **every** added point has this count at least 5. In the fixed run, 60/60 selected links flip channel; 320 points are added in total, the median is 5.5 added points per link, and the order-depth counts over all added points have min/median/max `5 / 8 / 21`. Thus the evidence is accurately described as an **order-separated link-external intervention**, not merely as "outside the empty link interval" and not as an unquantified claim of macroscopic remoteness. This is a constructive witness that this rank-based `chi` is **not** a microscopic link-local rule.\n'''
          assert old in d
          d=d.replace(old,new)
          d=d.replace('remote-population interventions can flip it without breaking the link or altering any old-old relation.',
                      'order-separated link-external interventions can flip it without breaking the link or altering any old-old relation.')
          p.write_text(d,encoding='utf-8',newline='\n')

          # --- STATUS ---
          p=Path('docs/STATUS.md')
          st=p.read_text(encoding='utf-8')
          oldrow='| **Stage 5B-2：rank-based $\\chi$ 不是 microscopic link-local rule** | **【已確認／本專案構造性介入】** | link 的 open Alexandrov interval 依定義為空，但 $\\Delta r_U,\\Delta r_V$ 會計數 interval 外的 null-coordinate strips。固定介入測試對 60 條低 margin links，僅在 interval 外加入元素、保持全部舊元素間 order relation 不變且保持原 $x\\lessdot y$ link，60/60 可翻轉 $\\chi$；所需加入元素中位數為 3。故**此 rank-based $\\chi$** 明確依賴 link 外 population，不是 microscopic link-local observable。範圍限定：此結論**不主張任何形式的 local two-state internal space 都不可能存在**；先前「number 是體積量所以任何 order+number 構造必然非局域」之過強說法已撤回。 | `docs/STAGE5B_RESULT_B.md`, `analysis/stage5b_link_channel.py`, `tests/test_stage5b_link_channel.py` |'
          newrow='| **Stage 5B-2：rank-based $\\chi$ 不是 microscopic link-local rule** | **【已確認／本專案構造性介入】** | link 的 open Alexandrov interval 依定義為空，但 $\\Delta r_U,\\Delta r_V$ 會計數 interval 外的 null-coordinate strips。修正版固定介入不再把「interval 外」與 `link_preserved` 當成兩項獨立證據，而另以純 order 量 $|I(w,y)\\cap C_{\\rm old}|$ 衡量新增點與端點之間的既有因果深度。source-of-record 只選擇每個新增點該深度皆 $\\ge5$ 的 60 條 links：60/60 可翻轉 $\\chi$，共加入 320 點、每 link 加入數中位 5.5；全部新增點之深度 min/median/max 為 $5/8/21$，且全部舊元素間 order relation 與原 $x\\lessdot y$ link 均保持。故**此 rank-based $\\chi$** 明確依賴 order-separated 的 link 外 population，不是 microscopic link-local observable。範圍限定：此結論**不主張任何形式的 local two-state internal space 都不可能存在**；先前「number 是體積量所以任何 order+number 構造必然非局域」之過強說法已撤回。 | `docs/STAGE5B_RESULT_B.md`, `analysis/stage5b_link_channel.py`, `tests/test_stage5b_link_channel.py` |'
          assert oldrow in st
          st=st.replace(oldrow,newrow)
          st=st.replace('構造性 remote-population intervention 在保持舊 order relation 與 link 本身不變時可 60/60 翻轉 $\\chi$，故此 $\\chi$ 不是 microscopic link-local rule。',
                        '修正版構造性介入以 $|I(w,y)\\cap C_{\\rm old}|\\ge5$ 作獨立 order-depth 門檻；60/60 可翻轉 $\\chi$ 且保持舊 order relation 與 link 本身不變，故此 $\\chi$ 不是 microscopic link-local rule。')
          p.write_text(st,encoding='utf-8',newline='\n')
          PY
      - name: Verify integrity
        run: python3 verify_integrity.py
      - name: Run full regression suite
        run: pytest tests/
      - name: Show revised benchmark
        run: python analysis/stage5b_link_channel.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/stage5b_link_channel.py tests/test_stage5b_link_channel.py docs/STAGE5B_RESULT_B.md docs/STATUS.md
          git commit -m 'Quantify Stage 5B intervention order depth'
          git push
