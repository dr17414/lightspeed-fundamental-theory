name: Apply STATUS v1.7

on:
  push:
    branches:
      - track-b-stage1-source-faithful
    paths:
      - '.status_parts/**'
      - '.github/workflows/apply-status-v17.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: track-b-stage1-source-faithful
      - name: Reconstruct and verify STATUS v1.7
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, bz2, hashlib

          parts = sorted(Path('.status_parts').glob('part*.b85'))
          if len(parts) != 13:
              raise SystemExit(f'expected 13 parts, found {len(parts)}')
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          raw = bz2.decompress(base64.b85decode(encoded.encode('ascii')))
          expected = '3bc9013128e1c9b07d475edf2511164167268bbd133f57a98f8c715c266288ea'
          actual = hashlib.sha256(raw).hexdigest()
          print(f'STATUS bytes={len(raw)} sha256={actual}')
          if actual != expected:
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {actual}')
          Path('docs/STATUS.md').write_bytes(raw)
          PY
      - name: Commit verified STATUS v1.7
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/STATUS.md
          if git diff --cached --quiet; then
            echo 'STATUS already matches verified v1.7'
            exit 0
          fi
          git commit -m 'Update STATUS to v1.7'
          git push origin HEAD:track-b-stage1-source-faithful
