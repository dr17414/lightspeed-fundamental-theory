name: Apply Stage 5B STATUS

on:
  push:
    branches: [ stage5b-limited-result-b ]
    paths: [ .github/workflows/apply-stage5b.yml ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: pip install numpy scipy pytest mpmath
      - name: Verify formal payload and patch STATUS
        env:
          ROWS_B64: 
          VER_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os, subprocess
          p=Path('docs/STATUS.md')
          pre=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          assert pre == '04ecbe3785e95028ffc1eef2d2b2ddf0fa54fe37', pre
          expected={
            'analysis/stage5b_link_channel.py':'201ed65079832e5c6544eb72661cf153821fc8ae',
            'tests/test_stage5b_link_channel.py':'aa65d4ed26ac6e92f06606ae7c99ffd66306e588',
            'docs/STAGE5B_RESULT_B.md':'a7496f5da03241b007c5edcaf8d7c767ae713e24',
          }
          for f,h in expected.items():
              got=subprocess.check_output(['git','hash-object',f],text=True).strip()
              assert got == h, (f,got,h)
          s=p.read_text(encoding='utf-8')
          rows=base64.b64decode(os.environ['ROWS_B64']).decode('utf-8')
          ver=base64.b64decode(os.environ['VER_B64']).decode('utf-8')
          anchor='| **Stage 5A small-$N$ dimension-2 假陽性警告**'
          line=next(x for x in s.splitlines(True) if x.startswith(anchor))
          assert 'Stage 5B-2：三值' not in s
          s=s.replace(line,line+rows,1)
          marker='*v1.9 (2026-08-26) - Stage 5A 完成：'
          i=s.index(marker)
          s=s[:i]+ver+s[i:]
          p.write_text(s,encoding='utf-8',newline='\n')
          post=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          assert post == 'ab0a68138f18af24ec953b0bb160d54e91a8fa42', post
          PY
      - name: Verify integrity
        run: python3 verify_integrity.py
      - name: Run Stage 5A and 5B regressions
        run: pytest -q tests/test_stage5a_realizer.py tests/test_stage5b_link_channel.py
      - name: Commit STATUS v1.10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/STATUS.md
          git commit -m 'Stage 5B limited Result B formalization'
          git push
